# coverage-config.yaml — OmniRoute aptapi-branch defaults, applied as OVERRIDES
# to the Hermes profile's config.yaml at bootstrap time (TTL-gated, 24h).
#
# Semantics:
#   - Keys listed here OVERWRITE the profile config.yaml (recursively merged;
#     leaf values replace whatever is present).
#   - Keys NOT listed here are left untouched.
#   - Contrast with the built-in defaults in __init__.py (DEFAULTS_CONFIG_YAML),
#     which only fill in MISSING keys. This file wins even over user-set values.
#
# This file enables the omniroute-hermes-plugin (aptapi branch):
#   - OmniRoute becomes the default model provider and default model.
#   - The official top-level `providers:` block routes to the aptapi.dev
#     production gateway over the Responses/Codex wire (codex_responses).
#   - Web search and image generation go through OmniRoute.
#   - Provider runtime still prefers the env overrides (OMNIROUTE_BASE_URL /
#     OMNIROUTE_API_KEY) for the actual endpoint and key.

model:
  provider: omniroute
  default: think/understanding

# ---- 辅助任务 → 能力剖面 lane（已确认映射）----
auxiliary:
  # 上下文压缩 → think/memory（context-optimized，长上下文档更可信）
  # 模型池: volcengine-coding/doubao-seed-2-1-turbo-260628 · volcengine-agent/doubao-seed-2.1-turbo
  #         volcengine-coding/deepseek-v4-1-flash-260910 · bai/deepseek-v4.1-flash · bai/kimi-k2.6
  compression:
    provider: omniroute
    model: think/memory

  # 任务分流/意图理解 → think/understanding（priority，glm-5.3-flash 系）
  triage_specifier:
    provider: omniroute
    model: think/understanding

  # 任务拆解/规划 → think/planning（priority，minimax-m3 98% 实证）
  kanban_decomposer:
    provider: omniroute
    model: think/planning

  # 视觉理解 → think/multimodal（priority，bai/mimo-v2.6-pro）
  # ⚠ glm-cn/glm-4.6v 已失效（165 次 0 成功，401 Invalid API key），故改指 bai/mimo
  vision:
    provider: omniroute
    model: think/multimodal

  # MoA 引用模型 → think/reasoning（priority，bai/kimi-k3）
  moa_reference:
    provider: omniroute
    model: think/reasoning

  # 安全审批 → reliable/safety（priority，bai/claude-haiku-5.5 100% 实证）
  approval:
    provider: omniroute
    model: reliable/safety

  # MCP 工具调用 → act/tool-calling（weighted）
  mcp:
    provider: omniroute
    model: act/tool-calling

  # 标题生成 → reliable/cost（cost-optimized，bai/gpt-5-nano 档）
  title_generation:
    provider: omniroute
    model: reliable/cost

web:
  search_backend: omniroute
  backend: omniroute

image_gen:
  provider: omniroute
  model: doubao-seedream-5.0-pro

plugins:
  enabled:
    - AptAPI Plugin Bootstrap
    - OmniRoute Config Bootstrap
    - image_gen/omniroute
    - web/omniroute
